name: News Home Reader CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout News Reader
        uses: actions/checkout@v4
        with:
          path: News-Home-Reader

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout essence
        uses: actions/checkout@v4
        with:
          repository: sknull/essence
          path: essence
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Decode Keystore
        if: matrix.os == 'ubuntu-latest'
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > News-Home-Reader/composeApp/release.keystore
          ls -l News-Home-Reader/composeApp/release.keystore

      - name: Verify Keystore Location
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Suche Keystore Datei:"
          find ${{ github.workspace }} -name "release.keystore"

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg xvfb

      - name: Run Tests
        working-directory: News-Home-Reader
        shell: bash
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          ./gradlew test jvmTest --no-configuration-cache

      - name: Build Binaries Only
        working-directory: News-Home-Reader
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            chmod +x gradlew
            xvfb-run ./gradlew packageReleaseDeb assembleRelease asciidoctorPdf --no-configuration-cache
          else
            ./gradlew packageReleaseMsi -x test --no-configuration-cache --no-daemon
          fi

      - name: Upload Intermediates
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ matrix.os }}
          path: |
            News-Home-Reader/composeApp/build/compose/binaries/
            News-Home-Reader/composeApp/build/outputs/apk/
            News-Home-Reader/composeApp/build/distributions/
            News-Home-Reader/composeApp/build/asciidoc/
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout News Reader
        uses: actions/checkout@v4
        with:
          path: News-Home-Reader

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout essence
        uses: actions/checkout@v4
        with:
          repository: sknull/essence
          path: essence
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: News-Home-Reader
          merge-multiple: true

      - name: Verify Files
        working-directory: News-Home-Reader
        run: |
          echo "Prüfe Ordnerstruktur:"
          ls -R compose/binaries || echo "Nicht gefunden!"
          echo "Suche MSI:"
          find . -name "*.msi"

      - name: Final Publish to GitHub Packages
        working-directory: News-Home-Reader
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
        run: |
          chmod +x gradlew
          ./gradlew publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache
