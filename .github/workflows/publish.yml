name: News Home Reader CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy: # Name des Jobs
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout News Reader
        uses: actions/checkout@v4
        with:
          path: News-Home-Reader

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout essence
        uses: actions/checkout@v4
        with:
          repository: sknull/essence
          path: essence
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Run Tests
        working-directory: News-Home-Reader
        shell: bash
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
        run: |
          chmod +x gradlew
          ./gradlew clean test jvmTest --no-configuration-cache

      - name: List All Generated Binaries
        working-directory: News-Home-Reader
        run: |
          echo "Suche nach allen ausführbaren Dateien im Build-Ordner:"
          find composeApp/build/compose/binaries -maxdepth 4 -name "*.deb" -o -nam

      - name: Build and Publish
        working-directory: News-Home-Reader
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            chmod +x gradlew
            ./gradlew packageReleaseDeb assembleDebug asciidoctorPdf publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache
          else
            # --no-daemon ist auf Windows-Runnern oft stabiler bei Speicherknappheit
            ./gradlew zip packageReleaseMsi publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache --no-daemon
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NewsHomeReader-Binaries-${{ matrix.os }}
          path: |
            News-Home-Reader/composeApp/build/compose/binaries/main/deb/*.deb
            News-Home-Reader/composeApp/build/compose/binaries/main/msi/*.msi
            News-Home-Reader/composeApp/build/distributions/*.zip
            News-Home-Reader/composeApp/build/outputs/apk/debug/*.apk
            News-Home-Reader/composeApp/build/asciidoc/*.pdf
          if-no-files-found: warn
