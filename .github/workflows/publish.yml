name: News Home Reader CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy: # Name des Jobs
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout News Reader
        uses: actions/checkout@v4
        with:
          path: News-Home-Reader

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout essence
        uses: actions/checkout@v4
        with:
          repository: sknull/essence
          path: essence
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Run Tests
        working-directory: News-Home-Reader
        shell: bash
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew clean test jvmTest --no-configuration-cache

      - name: Debug Path
        working-directory: News-Home-Reader
        run: |
          echo "Aktueller Ordner: $(pwd)"
          ls -R composeApp/build/compose || echo "Build Ordner existiert noch nicht!"

      - name: Build and Publish
        working-directory: News-Home-Reader
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
        shell: bash
        run: |
          chmod +x gradlew
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # xvfb-run simuliert ein Display, was oft für das Packaging nötig ist
            # Wir rufen erst den Task einzeln auf, um Fehler besser zu sehen
            xvfb-run ./gradlew packageReleaseDeb --info
            ./gradlew assembleDebug asciidoctorPdf publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache
          else
            ./gradlew packageReleaseMsi publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache --no-daemon
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NewsHomeReader-Binaries-${{ matrix.os }}
          path: |
            News-Home-Reader/composeApp/build/compose/binaries/main/deb/*.deb
            News-Home-Reader/composeApp/build/compose/binaries/main/msi/*.msi
            News-Home-Reader/composeApp/build/distributions/*.zip
            News-Home-Reader/composeApp/build/outputs/apk/debug/*.apk
            News-Home-Reader/composeApp/build/asciidoc/*.pdf
          if-no-files-found: warn
