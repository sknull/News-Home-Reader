name: News Home Reader CI

on:
  push:
    branches: [ "main" ]
#    paths:
#      - 'library/**'
#      - 'gradle/**'
#      - '*.kts'

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # macOS ist für KMP am stabilsten (auch wenn du noch kein iOS hast)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout News Reader
        uses: actions/checkout@v4
        with:
          path: News-Home-Reader

      - name: Checkout Library
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Debug Token
        run: |
          if [ -z "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "TOKEN IS EMPTY! Check your Secrets settings."
            exit 1
          else
            echo "Token is set."
          fi
      - name: Run Tests
        working-directory: News-Home-Reader
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_ACTOR: sknull
        run: |
          chmod +x gradlew
          ./gradlew test jvmTest --no-configuration-cache

      - name: Build Artifacts
        run: ./gradlew zip assembleDebug

#      - name: Publish to GitHub Packages
#        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#        run: ./gradlew clean :library:publishAllPublicationsToGitHubPackagesRepository --no-configuration-cache
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
